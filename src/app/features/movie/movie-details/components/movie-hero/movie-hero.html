<div class="movie-details--hero">
  <div class="bg-img">
    <img [src]="background()">
  </div>
  <div class="movie-details__info">
    <div class="container">
      <div class="info-top">
        <h2 class="movie-details__title">{{ title() }}</h2>
        @if (adult()) {
          <span>18+</span>
        }
      </div>
      <div class="info-middle">
        <app-meta-info
          [rating]="rating()"
          [year] = "date()"
          [genreText]="genres()"
          [runtime]="runtime()"
          [country] = "countries()?.name"
        >

        </app-meta-info>
      </div>

      <div class="movie-hero__actions">
        <app-button [text]="'Смотреть фильм'" ></app-button>
        <app-button [variant]="'secondary'" [text]="'Трейлер'" (click)="watchedVideo()"></app-button>
        <app-button [variant]="'icon'" [icon] = "'file-plus'"></app-button>
        <app-button [variant]="'icon'" [icon] = "'heart'"  [favorite]="isFavorite()" (click)="toggleFavorite()"></app-button>
      </div>
    </div>
  </div>
</div>
