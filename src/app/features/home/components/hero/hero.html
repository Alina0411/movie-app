<section class="hero">
  <div class="container">
    <div class="hero__wrapper">
      <div class="hero__content">
        <h1 class="hero__title">
          Самые сочные премьеры кино — у вас дома
        </h1>

        <p class="hero__description">
          Ежедневно пополняемая библиотека с лучшими фильмами
          и сериалами — в дубляже и оригинале.
          Целый месяц бесплатно!
        </p>

        <button class="hero__button" type="button">
          Смотреть бесплатно
        </button>
      </div>

      <app-slider variant="hero" class="hero__slider">
        @for (movie of movies(); track movie.id) {
          <swiper-slide>
            <article class="movie-card">
              <div class="movie-card__poster">
                <img
                  [src]="'https://image.tmdb.org/t/p/w500' + movie.poster_path"
                  [alt]="movie.title"
                  loading="lazy"
                />
              </div>

              <div class="movie-card__info">
                <h2 class="movie-card__title">
                  {{ movie.title }}
                </h2>

                <div
                  class="movie-card__meta"
                  [class.movie-card__meta--red]="movie.id % 2 !== 0"
                  [class.movie-card__meta--green]="movie.id % 2 === 0"
                >
                  <span class="movie-card__label">Премьера</span>
                  <time class="movie-card__date">
                    {{ movie.release_date | date :'dd MMMM' }}
                  </time>
                </div>
              </div>
            </article>
          </swiper-slide>
        }
      </app-slider>
    </div>
  </div>
</section>
